trivial_regex = "warn"
trivially_copy_pass_by_ref = "allow"
tuple_array_conversions = "warn"
unchecked_time_subtraction = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnecessary_box_returns = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_join = "warn"
unnecessary_literal_bound = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unnecessary_semicolon = "allow"
unnecessary_struct_initialization = "warn"
unnecessary_wraps = "allow"
unreachable = "warn"
unsafe_derive_deserialize = "warn"
unused_self = "warn"
unused_trait_names = "allow"
unwrap_in_result = "warn"
unwrap_used = "warn"
use_debug = "warn"
use_self = "warn"
wildcard_imports = "allow"
let_and_return = "allow"

[dependencies]
anyhow = { version = "1", features = ["std"], default-features = false }
ciborium = { version = "0.2.2", default-features = false,  features = ["default"]}
clap = { version = "4.5", features = ["derive", "help", "std", "color", "usage", "error-context", "suggestions"], default-features = false }
flate2 = { version = "1.1.2", features = ["zlib"], default-features = false }
glob = { version = "0.3", default-features = false }
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = { version = "1.0", features = ["preserve_order", "std"], default-features = false }
serde_yaml = { version = "0.9", default-features = false }
walkdir = { version = "2", default-features = false }


[lib]
path = "src/lib.rs"
name = "mcdp_format2_rs"
crate-type = ["rlib"]
required-features = []

[[bin]]
path = "src/main.rs"
name = "mcdp-format2-rs-load"
required-features = []


[dev-dependencies]
datatest-stable = "0.3"


[features]
default = []



[[test]]
name = "datasets"
harness = false
