      CIRCLEVAR_PIPELINE_CONFIG_SHA: << pipeline.config.sha >>
      CIRCLEVAR_PIPELINE_DEFINITION_ID: << pipeline.definition.id >>
      CIRCLEVAR_PIPELINE_DEPLOY_COMPONENT_NAME: << pipeline.deploy.component_name >>
      CIRCLEVAR_PIPELINE_DEPLOY_CURRENT_VERSION: << pipeline.deploy.current_version >>
      CIRCLEVAR_PIPELINE_DEPLOY_ENVIRONMENT_NAME: << pipeline.deploy.environment_name >>
      CIRCLEVAR_PIPELINE_DEPLOY_NAMESPACE: << pipeline.deploy.namespace >>
      CIRCLEVAR_PIPELINE_DEPLOY_REASON: << pipeline.deploy.reason >>
      CIRCLEVAR_PIPELINE_DEPLOY_TARGET_VERSION: << pipeline.deploy.target_version >>
      CIRCLEVAR_PIPELINE_EVENT_ACTION: << pipeline.event.action >>
      CIRCLEVAR_PIPELINE_EVENT_CONTEXT_GITHUB_PR_URL: << pipeline.event.context.github.pr_url >>
      CIRCLEVAR_PIPELINE_EVENT_GITHUB_AFTER: << pipeline.event.github.after >>
      CIRCLEVAR_PIPELINE_EVENT_GITHUB_COMMENT_BODY: << pipeline.event.github.comment.body >>
      CIRCLEVAR_PIPELINE_EVENT_GITHUB_HEAD_COMMIT_URL: << pipeline.event.github.head_commit.url >>
      CIRCLEVAR_PIPELINE_EVENT_GITHUB_LABEL_NAME: << pipeline.event.github.label.name >>
      CIRCLEVAR_PIPELINE_EVENT_GITHUB_PULL_REQUEST_BASE_REF: << pipeline.event.github.pull_request.base.ref >>
      CIRCLEVAR_PIPELINE_EVENT_GITHUB_PULL_REQUEST_BASE_SHA: << pipeline.event.github.pull_request.base.sha >>
      CIRCLEVAR_PIPELINE_EVENT_GITHUB_PULL_REQUEST_DRAFT: << pipeline.event.github.pull_request.draft >>
      CIRCLEVAR_PIPELINE_EVENT_GITHUB_PULL_REQUEST_HEAD_REF: << pipeline.event.github.pull_request.head.ref >>
      CIRCLEVAR_PIPELINE_EVENT_GITHUB_PULL_REQUEST_HEAD_SHA: << pipeline.event.github.pull_request.head.sha >>
      CIRCLEVAR_PIPELINE_EVENT_GITHUB_PULL_REQUEST_MERGED: << pipeline.event.github.pull_request.merged >>
      CIRCLEVAR_PIPELINE_EVENT_GITHUB_PULL_REQUEST_NUMBER: << pipeline.event.github.pull_request.number >>
      CIRCLEVAR_PIPELINE_EVENT_GITHUB_PULL_REQUEST_TITLE: << pipeline.event.github.pull_request.title >>
      CIRCLEVAR_PIPELINE_EVENT_GITHUB_PULL_REQUEST_URL: << pipeline.event.github.pull_request.url >>
      CIRCLEVAR_PIPELINE_EVENT_GITHUB_REF: << pipeline.event.github.ref >>
      CIRCLEVAR_PIPELINE_EVENT_GITHUB_REPOSITORY_NAME: << pipeline.event.github.repository.name >>
      CIRCLEVAR_PIPELINE_EVENT_GITHUB_REPOSITORY_OWNER_LOGIN: << pipeline.event.github.repository.owner.login >>
      CIRCLEVAR_PIPELINE_EVENT_GITHUB_REPOSITORY_URL: << pipeline.event.github.repository.url >>
      CIRCLEVAR_PIPELINE_EVENT_GITHUB_SENDER_AVATAR_URL: << pipeline.event.github.sender.avatar_url >>
