version: 2.1
parameters:
  context_name:
    type: string
    default: z7-stage
workflows:
  test:
    jobs:
    - test1:
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
    - rustfmt:
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
    - lint:
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
    - install:
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
        requires:
        - test1
orbs:
  codecov: codecov/codecov@6
jobs:
  lint:
    environment:
      CARGO_HOME: /root/.cargo
      ZUPER_RS_LINT_OUTPUT_DIR: out/zuper-rs-lint
      ZUPER_RS_LINT_TEST_RESULTS_DIR: out/test-results
    docker:
    - image: docker.io/${DOCKER_TARGET_ORG}/${DOCKER_REPO_PREFIX}zuper-rs-ci:${Z_DISTRO}-${Z_UNIVERSE}
    resource_class: zuper-ci-ns/r1
    steps:
    - checkout
    - run: &prepare_cargo_configuration
        name: Prepare Cargo configuration
        command: |
          zuper-rs-ci-tools cargo-wrap zuper-rs-ci-tools prepare-cargo-config
          zuper-rs-ci-tools cargo-wrap zuper-rs-ci-tools prepare-deps
    - run:
        name: Report tool versions
        command: |
          saferun --version
          zuper-rs-lint --version
    - run:
        name: Generate zuper-rs-lint reports
        command: >-
          saferun run
          --no-direnv
          --standalone
          --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/lint
          --heartbeat 30s
          --stats-interval 5s
          -- zuper-rs-ci-tools cargo-wrap zuper-rs-lint ci
    - store_test_results:
        path: out/test-results
    - store_artifacts:
        path: out/zuper-rs-lint
        destination: zuper-rs-lint
    - store_artifacts:
        path: out/saferun
        destination: saferun
  rustfmt:
    environment:
      CARGO_HOME: /root/.cargo
    docker:
    - image: docker.io/${DOCKER_TARGET_ORG}/${DOCKER_REPO_PREFIX}zuper-rs-ci:${Z_DISTRO}-${Z_UNIVERSE}
    resource_class: small.gen2
    steps:
    - checkout
    - run: *prepare_cargo_configuration
    - run:
        name: Report tool versions
        command: |
          saferun --version
          cargo +nightly --version
          rustfmt +nightly --version
    - run:
        name: Check Rust formatting
        command: >-
          saferun run
          --no-direnv
          --standalone
          --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/rustfmt
          --heartbeat 30s
          --stats-interval 5s
          -- zuper-rs-ci-tools cargo-wrap cargo +nightly fmt --all -- --check
    - store_artifacts:
        path: out/saferun
        destination: saferun
  test1:
    environment:
      CARGO_HOME: /root/.cargo
    docker:
    - image: docker.io/${DOCKER_TARGET_ORG}/${DOCKER_REPO_PREFIX}zuper-rs-ci:${Z_DISTRO}-${Z_UNIVERSE}
    steps:
    - checkout
    - run:
        name: Prepare the environment
        command: |
          zuper-rs-ci-tools cargo-wrap zuper-rs-ci-tools all
          mkdir -p out/test-results target/llvm-cov-target
    - run:
        name: Report tool versions
        command: |
          saferun --version
          cargo --version
          cargo nextest --version
          cargo llvm-cov --version
          make --version
    - store_artifacts:
        path: build-stats
        destination: build-stats
    - run:
        name: pre-circle-tests
        command: |
          TARGET=pre-circle-tests
          if make -n $TARGET ; then
              saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/pre-circle-tests --heartbeat 30s --stats-interval 5s -- zuper-rs-ci-tools cargo-wrap make pre-circle-tests
          else
              echo "Target $TARGET not defined"
          fi
    - run:
        name: Compile and archive coverage tests
        command: >-
          saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/test-compile --heartbeat 30s --stats-interval 5s -- zuper-rs-ci-tools cargo-wrap cargo llvm-cov nextest-archive --archive-file out/nextest-coverage-tests.tar.zst --all-targets --no-default-features --profile ci --config-file .circleci/nextest.toml
    - run:
        name: Run coverage tests
        command: >-
          saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/test-run --heartbeat 30s --stats-interval 5s -- env CARGO_LLVM_COV_TARGET_DIR=target/llvm-cov-target LLVM_PROFILE_FILE_NAME=node-${CIRCLE_NODE_INDEX}-%m-%p.profraw zuper-rs-ci-tools cargo-wrap cargo llvm-cov nextest --no-report --archive-file out/nextest-coverage-tests.tar.zst -v --no-fail-fast --profile ci --config-file .circleci/nextest.toml --partition hash:$((CIRCLE_NODE_INDEX + 1))/${CIRCLE_NODE_TOTAL}
    - run:
        name: Generate coverage report
        command: >-
          saferun run
          --no-direnv
          --standalone
          --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/coverage-report
          --heartbeat 30s
          --stats-interval 5s
          -- env CARGO_LLVM_COV_TARGET_DIR=target/llvm-cov-target zuper-rs-ci-tools cargo-wrap cargo llvm-cov report
          --nextest-archive-file out/nextest-coverage-tests.tar.zst
          --lcov
          --output-path lcov.info
    - run:
        name: copy results
        when: always
        command: |
          cp target/nextest/ci/junit.xml out/test-results/report-${CIRCLE_NODE_INDEX}.xml || true
    - run:
        name: post-circle-tests
        when: always
        command: |
          TARGET=post-circle-tests
          if make -n $TARGET ; then
              saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/post-circle-tests --heartbeat 30s --stats-interval 5s -- zuper-rs-ci-tools cargo-wrap make post-circle-tests
          else
              echo "Target $TARGET not defined"
          fi
    - store_test_results:
        path: out/test-results
    - store_artifacts:
        path: out/coverage
        destination: coverage
    - store_artifacts:
        path: out/saferun
        destination: saferun
    - codecov/upload:
        when: always
    resource_class: zuper-ci-ns/r4
  install:
    environment:
      CARGO_HOME: /root/.cargo
    docker:
    - image: docker.io/${DOCKER_TARGET_ORG}/${DOCKER_REPO_PREFIX}zuper-rs-ci:${Z_DISTRO}-${Z_UNIVERSE}
    resource_class: zuper-ci-ns/r4
    steps:
    - checkout
    - run:
        name: Prepare Cargo configuration
        command: |
          zuper-rs-ci-tools cargo-wrap zuper-rs-ci-tools prepare-cargo-config
          zuper-rs-ci-tools cargo-wrap zuper-rs-ci-tools prepare-deps
    - run:
        name: Report tool versions
        command: |
          saferun --version
          cargo --version
          make --version
    - run:
        name: Install binaries
        command: >-
          saferun run
          --no-direnv
          --standalone
          --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/install
          --heartbeat 30s
          --stats-interval 5s
          -- zuper-rs-ci-tools cargo-wrap make install
    - store_artifacts:
        path: /root/.cargo/bin
        destination: bin
    - store_artifacts:
        path: out/saferun
        destination: saferun

