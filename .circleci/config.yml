version: 2.1
parameters:
  context_name:
    type: string
    default: z7-stage
workflows:
  test:
    jobs:
    - test1:
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
    - rustfmt:
        context: <<pipeline.parameters.context_name>>
        requires:
        - test1
        filters:
          tags:
            ignore: /.*/
    - zuper-rs-lint:
        context: <<pipeline.parameters.context_name>>
        requires:
        - test1
        filters:
          tags:
            ignore: /.*/
orbs:
  codecov: codecov/codecov@6
jobs:
  zuper-rs-lint:
    environment:
      CARGO_HOME: /root/.cargo
      ZUPER_RS_LINT_OUTPUT_DIR: out/zuper-rs-lint
      ZUPER_RS_LINT_TEST_RESULTS_DIR: out/test-results
    docker:
    - image: docker.io/${DOCKER_TARGET_ORG}/${DOCKER_REPO_PREFIX}zuper-rs-ci:${Z_DISTRO}-${Z_UNIVERSE}
    resource_class: small
    steps:
    - checkout
    - run:
        name: Prepare Cargo configuration
        command: |
          zuper-rs-ci-tools prepare-cargo-config
          zuper-rs-ci-tools prepare-deps
    - run:
        name: Generate zuper-rs-lint reports
        command: zuper-rs-lint ci
    - store_test_results:
        path: out/test-results
    - store_artifacts:
        path: out/zuper-rs-lint
        destination: zuper-rs-lint
  rustfmt:
    environment:
      CARGO_HOME: /root/.cargo
    docker:
    - image: docker.io/${DOCKER_TARGET_ORG}/${DOCKER_REPO_PREFIX}zuper-rs-ci:${Z_DISTRO}-${Z_UNIVERSE}
    resource_class: small
    steps:
    - checkout
    - run:
        name: Prepare Cargo configuration
        command: |
          zuper-rs-ci-tools prepare-cargo-config
          zuper-rs-ci-tools prepare-deps
    - run:
        name: Check Rust formatting
        command: cargo +nightly fmt --all -- --check
  test1:
    environment:
      CARGO_HOME: /root/.cargo
    docker:
    - image: docker.io/${DOCKER_TARGET_ORG}/${DOCKER_REPO_PREFIX}zuper-rs-ci:${Z_DISTRO}-${Z_UNIVERSE}
    steps:
    - checkout
    - run:
        name: Prepare the environment
        command: |
          zuper-rs-ci-tools all
          mkdir -p out/test-results
    - store_artifacts:
        path: build-stats
        destination: build-stats
    - run:
        name: pre-circle-tests
        command: make pre-circle-tests
    - run:
        name: Compile and archive coverage tests
        command: |
          mkdir -p out
          cargo llvm-cov nextest-archive \
            --archive-file out/nextest-coverage-tests.tar.zst \
            --all-targets \
            --no-default-features \
            --profile ci \
            --config-file .circleci/nextest.toml
    - run:
        name: Run coverage tests
        command: |
          cargo llvm-cov nextest \
            --no-report \
            --archive-file out/nextest-coverage-tests.tar.zst \
            -v \
            --no-fail-fast \
            --profile ci \
            --config-file .circleci/nextest.toml \
            --partition hash:$((CIRCLE_NODE_INDEX + 1))/${CIRCLE_NODE_TOTAL}
    - run:
        name: Generate coverage report
        command: |
          cargo llvm-cov report \
            --nextest-archive-file out/nextest-coverage-tests.tar.zst \
            --lcov \
            --output-path lcov.info
    - run:
        name: copy results
        when: always
        command: |
          cp target/nextest/ci/junit.xml out/test-results/report-${CIRCLE_NODE_INDEX}.xml || true
    - store_test_results:
        path: out/test-results
    - store_artifacts:
        path: out/coverage
        destination: coverage
    - codecov/upload:
        when: always
    resource_class: zuper-ci-ns/r4

