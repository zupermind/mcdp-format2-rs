          printf 'export CARGO_TARGET_DIR=%q\n' "${CARGO_TARGET_DIR}" >> "${BASH_ENV}"
          zuper-rs-ci-tools cargo-wrap zuper-rs-ci-tools prepare-cargo-config
          zuper-rs-ci-tools cargo-wrap zuper-rs-ci-tools prepare-deps
    - run:
        name: pre-circle-lint
        command: saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/pre-circle-lint --heartbeat 30s --stats-interval 5s -- zuper-rs-ci-tools cargo-wrap zuper-rs-ci-tools run-if-make-target-exists pre-circle-lint
    - run:
        name: Prefetch locked Cargo dependencies
        command: saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/cargo-fetch --heartbeat 30s --stats-interval 5s -- zuper-rs-ci-tools cargo-wrap cargo fetch --locked
    - run:
        name: Report tool versions
        command: |
          saferun --version
          zuper-rs-lint --version
    - run:
        name: Require zuper-rs-lint ^15.0
        command: zuper-rs-lint version-required '^15.0'
    - run:
        name: Generate zuper-rs-lint reports
        command: saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/lint --heartbeat 30s --stats-interval 5s -- zuper-rs-ci-tools cargo-wrap zuper-rs-lint run --suite ci-timeless --html-report "${ZUPER_RS_LINT_OUTPUT_DIR}/report.html" --junit-report "${ZUPER_RS_LINT_TEST_RESULTS_DIR}/zuper-rs-lint.xml"
    - store_test_results:
        path: out/test-results
    - store_artifacts:
        path: out/zuper-rs-lint
        destination: zuper-rs-lint
    - store_artifacts:
        path: out/saferun
        destination: saferun
  lint-pr-ready:
    environment:
      CARGO_HOME: /root/.cargo
      CIRCLEVAR_PIPELINE_CONFIG_FILE_PATH: << pipeline.config.file_path >>
