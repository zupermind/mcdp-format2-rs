    environment:
      CARGO_HOME: /root/.cargo
    docker:
    - image: docker.io/${DOCKER_TARGET_ORG}/${DOCKER_REPO_PREFIX}zuper-rs-ci-checks:${Z_DISTRO}-${Z_UNIVERSE}-v1
      auth:
        username: $DOCKER_IO_READONLY_USERNAME
        password: $DOCKER_IO_READONLY_TOKEN
    resource_class: small
    steps:
    - checkout
    - run:
        name: Initialize Git submodules
        command: zuper-rs-ci-tools initialize-git-submodules
    - run:
        name: Prepare Cargo configuration
        command: |
          export CARGO_TARGET_DIR="$(pwd)/target"
          printf 'export CARGO_TARGET_DIR=%q\n' "${CARGO_TARGET_DIR}" >> "${BASH_ENV}"
          zuper-rs-ci-tools cargo-wrap zuper-rs-ci-tools prepare-cargo-config
          zuper-rs-ci-tools cargo-wrap zuper-rs-ci-tools prepare-deps
    - run:
        name: pre-circle-rustfmt
