      CIRCLEVAR_PIPELINE_GIT_REVISION: << pipeline.git.revision >>
      CIRCLEVAR_PIPELINE_GIT_TAG: << pipeline.git.tag >>
      CIRCLEVAR_PIPELINE_ID: << pipeline.id >>
      CIRCLEVAR_PIPELINE_INTEGRATION_SOURCE: << pipeline.integration_source >>
      CIRCLEVAR_PIPELINE_NAME: << pipeline.name >>
      CIRCLEVAR_PIPELINE_NUMBER: << pipeline.number >>
      CIRCLEVAR_PIPELINE_PROJECT_GIT_URL: << pipeline.project.git_url >>
      CIRCLEVAR_PIPELINE_PROJECT_SLUG: << pipeline.project.slug >>
      CIRCLEVAR_PIPELINE_PROJECT_TYPE: << pipeline.project.type >>
      CIRCLEVAR_PIPELINE_SCHEDULE_ID: << pipeline.schedule.id >>
      CIRCLEVAR_PIPELINE_SCHEDULE_NAME: << pipeline.schedule.name >>
      CIRCLEVAR_PIPELINE_TRIGGER_ID: << pipeline.trigger.id >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_GITLAB_BRANCH: << pipeline.trigger_parameters.gitlab.branch >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_GITLAB_CHECKOUT_SHA: << pipeline.trigger_parameters.gitlab.checkout_sha >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_GITLAB_COMMIT_AUTHOR_EMAIL: << pipeline.trigger_parameters.gitlab.commit_author_email >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_GITLAB_COMMIT_AUTHOR_NAME: << pipeline.trigger_parameters.gitlab.commit_author_name >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_GITLAB_COMMIT_MESSAGE: << pipeline.trigger_parameters.gitlab.commit_message >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_GITLAB_COMMIT_SHA: << pipeline.trigger_parameters.gitlab.commit_sha >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_GITLAB_COMMIT_TIMESTAMP: << pipeline.trigger_parameters.gitlab.commit_timestamp >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_GITLAB_COMMIT_TITLE: << pipeline.trigger_parameters.gitlab.commit_title >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_GITLAB_DEFAULT_BRANCH: << pipeline.trigger_parameters.gitlab.default_branch >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_GITLAB_IS_FORK_MERGE_REQUEST: << pipeline.trigger_parameters.gitlab.is_fork_merge_request >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_GITLAB_REF: << pipeline.trigger_parameters.gitlab.ref >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_GITLAB_REPO_NAME: << pipeline.trigger_parameters.gitlab.repo_name >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_GITLAB_REPO_URL: << pipeline.trigger_parameters.gitlab.repo_url >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_GITLAB_TYPE: << pipeline.trigger_parameters.gitlab.type >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_GITLAB_USER_AVATAR: << pipeline.trigger_parameters.gitlab.user_avatar >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_GITLAB_USER_ID: << pipeline.trigger_parameters.gitlab.user_id >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_GITLAB_USER_NAME: << pipeline.trigger_parameters.gitlab.user_name >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_GITLAB_USER_USERNAME: << pipeline.trigger_parameters.gitlab.user_username >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_GITLAB_WEB_URL: << pipeline.trigger_parameters.gitlab.web_url >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_GITLAB_X_GITLAB_EVENT_ID: << pipeline.trigger_parameters.gitlab.x_gitlab_event_id >>
      CIRCLEVAR_PIPELINE_TRIGGER_PARAMETERS_WEBHOOK_BODY: << pipeline.trigger_parameters.webhook.body >>
      CIRCLEVAR_PIPELINE_TRIGGER_RECEIVED_AT: << pipeline.trigger.received_at >>
      CIRCLEVAR_PIPELINE_TRIGGER_TYPE: << pipeline.trigger.type >>
      ZUPER_RS_LINT_OUTPUT_DIR: out/zuper-rs-lint
      ZUPER_RS_LINT_TEST_RESULTS_DIR: out/test-results
    docker:
    - image: docker.io/${DOCKER_TARGET_ORG}/${DOCKER_REPO_PREFIX}zuper-rs-ci:${Z_DISTRO}-${Z_UNIVERSE}
      auth:
        username: $DOCKER_IO_READONLY_USERNAME
        password: $DOCKER_IO_READONLY_TOKEN
    resource_class: small.gen2
    steps:
    - checkout
    - run:
        name: Initialize Git submodules
        command: |
          eval "$(ssh-agent -s)"
          printf '%s' "${ZUPER_UTILS_BUILD_DEPLOY_KEY_B64}" | base64 --decode | ssh-add -
          GIT_SSH_COMMAND='ssh -o StrictHostKeyChecking=accept-new' git submodule update --init --recursive
    - run:
        name: Prepare Cargo configuration
        command: |
          export CARGO_TARGET_DIR="$(pwd)/target"
          printf 'export CARGO_TARGET_DIR=%q\n' "${CARGO_TARGET_DIR}" >> "${BASH_ENV}"
          zuper-rs-ci-tools cargo-wrap zuper-rs-ci-tools prepare-cargo-config
          zuper-rs-ci-tools cargo-wrap zuper-rs-ci-tools prepare-deps
    - run:
        name: Report tool versions
        command: |
          saferun --version
          zuper-rs-lint --version
    - run:
        name: Resolve pull-request base context
        command: |
          if [ -n "${CIRCLEVAR_PIPELINE_EVENT_GITHUB_PULL_REQUEST_BASE_REF:-}" ] && [ "${CIRCLEVAR_PIPELINE_EVENT_GITHUB_PULL_REQUEST_BASE_REF}" != "<nil>" ]; then
            printf 'export ZUPER_RS_LINT_PR_BASE_REF=%q\n' "${CIRCLEVAR_PIPELINE_EVENT_GITHUB_PULL_REQUEST_BASE_REF}" >> "${BASH_ENV}"
          elif [ -n "${CIRCLE_PULL_REQUEST:-}" ]; then
            # OAuth base_revision is the previous branch build, not the PR target. GitHub's merge-ref first parent is the exact target commit.
            pull_request_url="${CIRCLE_PULL_REQUEST%/}"
            pull_request_number="${pull_request_url##*/}"
            case "${pull_request_number}" in
              ''|*[!0-9]*)
                echo "Cannot extract a numeric pull-request number from CIRCLE_PULL_REQUEST=${CIRCLE_PULL_REQUEST}" >&2
                exit 1
                ;;
            esac
            merge_ref="refs/zuper-rs-lint/pull/${pull_request_number}/merge"
            cleanup_merge_ref() {
              git update-ref -d "${merge_ref}" >/dev/null 2>&1 || true
            }
            trap cleanup_merge_ref EXIT
            if ! git fetch --no-tags --quiet origin "+refs/pull/${pull_request_number}/merge:${merge_ref}"; then
              echo "Cannot fetch GitHub pull-request merge ref refs/pull/${pull_request_number}/merge" >&2
              exit 1
            fi
            if ! pull_request_base_sha="$(git rev-parse "${merge_ref}^1")"; then
              echo "Cannot resolve the first parent of GitHub pull-request merge ref ${merge_ref}" >&2
              exit 1
            fi
            cleanup_merge_ref
            trap - EXIT
            printf 'export ZUPER_RS_LINT_PR_BASE_SHA=%q\n' "${pull_request_base_sha}" >> "${BASH_ENV}"
          fi
    - run:
        name: Generate zuper-rs-lint reports
        command: saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/lint --heartbeat 30s --stats-interval 5s -- zuper-rs-ci-tools cargo-wrap zuper-rs-lint ci --exclude RUST-CARGO-LOCK-ZUPER-ADVANCED
    - store_test_results:
        path: out/test-results
    - store_artifacts:
        path: out/zuper-rs-lint
        destination: zuper-rs-lint
    - store_artifacts:
        path: out/saferun
        destination: saferun
  lint-fresh:
    environment:
      CARGO_HOME: /root/.cargo
      CIRCLEVAR_PIPELINE_CONFIG_FILE_PATH: << pipeline.config.file_path >>
      CIRCLEVAR_PIPELINE_CONFIG_REF: << pipeline.config.ref >>
