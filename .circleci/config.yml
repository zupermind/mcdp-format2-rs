version: 2.1
parameters:
  context_name:
    type: string
    default: z7-stage
workflows:
  test:
    jobs:
    - test1:
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
    - rustfmt:
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
    - zuper-rs-lint:
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
orbs:
  codecov: codecov/codecov@6
jobs:
  zuper-rs-lint:
    environment:
      CARGO_HOME: /root/.cargo
    docker:
    - image: docker.io/${DOCKER_TARGET_ORG}/${DOCKER_REPO_PREFIX}zuper-rs-ci:${Z_DISTRO}-${Z_UNIVERSE}
    resource_class: small
    steps:
    - checkout
    - run:
        name: Prepare Cargo configuration
        command: |
          zuper-rs-ci prepare-cargo-config
          zuper-rs-ci prepare-deps
    - run:
        name: Generate zuper-rs-lint report
        command: |
          mkdir -p out/zuper-rs-lint
          set +e
          zuper-rs-lint --json > out/zuper-rs-lint/report.json
          lint_status=$?
          set -e
          if [ "$lint_status" -eq 1 ]; then
              echo "zuper-rs-lint reported findings; see the report artifact."
              exit 0
          fi
          exit "$lint_status"
    - store_artifacts:
        path: out/zuper-rs-lint/report.json
        destination: zuper-rs-lint/report.json
  rustfmt:
    environment:
      CARGO_HOME: /root/.cargo
    docker:
    - image: docker.io/${DOCKER_TARGET_ORG}/${DOCKER_REPO_PREFIX}zuper-rs-ci:${Z_DISTRO}-${Z_UNIVERSE}
    resource_class: small
    steps:
    - checkout
    - run:
        name: Prepare Cargo configuration
        command: |
          zuper-rs-ci prepare-cargo-config
          zuper-rs-ci prepare-deps
    - run:
        name: Check Rust formatting
        command: cargo +nightly fmt --all -- --check
  test1:
    environment:
      CARGO_HOME: /root/.cargo
    docker:
    - image: docker.io/${DOCKER_TARGET_ORG}/${DOCKER_REPO_PREFIX}zuper-rs-ci:${Z_DISTRO}-${Z_UNIVERSE}
    steps:
    - checkout
    - run:
        name: Prepare the environment
        command: |
          zuper-rs-ci all
          mkdir -p out/test-results
    - store_artifacts:
        path: build-stats
        destination: build-stats
    - run:
        name: pre-circle-tests
        command: |
          TARGET=pre-circle-tests
          if make -n $TARGET ; then
          make $TARGET
          else
          echo "Target $TARGET not defined"
          fi
    - run:
        name: Run tests
        command: |
          cargo llvm-cov --no-cfg-coverage nextest --lcov  \
            --output-path lcov.info \
            --all-targets \
            --no-default-features \
            -v \
            --no-fail-fast \
            --profile ci \
            --config-file .circleci/nextest.toml \
            --partition hash:$((CIRCLE_NODE_INDEX + 1))/${CIRCLE_NODE_TOTAL}
    - run:
        name: copy results
        when: always
        command: |
          cp target/nextest/ci/junit.xml out/test-results/report-${CIRCLE_NODE_INDEX}.xml || true
    - run:
        name: post-circle-tests
        when: always
        command: |
          TARGET=post-circle-tests
          if make -n $TARGET ; then
              make $TARGET
          else
              echo "Target $TARGET not defined"
          fi
    - store_test_results:
        path: out/test-results
    - store_artifacts:
        path: out/coverage
        destination: coverage
    - codecov/upload:
        when: always
    resource_class: zuper-ci-ns/r4

