version: 2.1
parameters:
  context_name:
    type: string
    default: z7-stage
workflows:
  install:
    jobs:
    - install-linux:
        context: <<pipeline.parameters.context_name>>
        filters:
          branches:
            only:
            - z7-stage
            - z7-prod
            - z7-stage-lupa
          tags:
            ignore: /.*/
    - install-osx:
        context: <<pipeline.parameters.context_name>>
        filters:
          branches:
            only:
            - z7-stage
            - z7-prod
            - z7-stage-lupa
          tags:
            ignore: /.*/
  tag-upload:
    jobs:
    - tag-upload:
        context: <<pipeline.parameters.context_name>>
        filters:
          branches:
            only:
            - z7-stage
            - z7-prod
            - z7-stage-lupa
          tags:
            ignore: /.*/
  fresh:
    jobs:
    - lint-fresh:
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
  test:
    jobs:
    - pre-gate:
        filters:
          tags:
            ignore: /.*/
    - test-compile:
        requires:
        - pre-gate
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
        name: test-compile
    - test-run:
        requires:
        - test-compile
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
        name: test-run-1
        worker_index: 0
    - test-run-aggregate:
        requires:
        - test-run-1
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
        name: test-run-aggregate
    - test-report:
        requires:
        - test-run-aggregate
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
        name: test-report
    - rustfmt:
        requires:
        - pre-gate
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
    - lint:
        requires:
        - pre-gate
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
orbs:
  codecov: codecov/codecov@6
jobs:
  pre-gate:
    docker:
    - image: cimg/base:stable
    resource_class: small.gen2
    steps:
    - checkout
    - run:
        name: Verify pull-request head contains its target branch
        command: |
          set -eu

          if [ -z "${CIRCLE_SHA1:-}" ]; then
            echo "CIRCLE_SHA1 is required for pull-request target-containment checks." >&2
            exit 1
          fi

          if ! pull_request_heads="$(git ls-remote --refs origin 'refs/pull/*/head')"; then
            echo "Cannot query GitHub pull-request head refs from origin." >&2
            exit 1
          fi
          pull_request_numbers="$(
            printf '%s\n' "${pull_request_heads}" |
              awk -v sha="${CIRCLE_SHA1}" '
                $1 == sha {
                  ref = $2
                  sub("^refs/pull/", "", ref)
                  sub("/head$", "", ref)
                  print ref
                }
              '
          )"
          if [ -z "${pull_request_numbers}" ]; then
            echo "No GitHub pull-request head ref matches ${CIRCLE_SHA1}; target-containment pre-gate does not apply."
            exit 0
          fi

          cleanup_merge_ref() {
            for pull_request_number in ${pull_request_numbers}; do
              git update-ref -d "refs/zuper-pre-gate/pull/${pull_request_number}/merge" >/dev/null 2>&1 || true
            done
          }
          trap cleanup_merge_ref EXIT
          for pull_request_number in ${pull_request_numbers}; do
            case "${pull_request_number}" in
              ''|*[!0-9]*)
                echo "Invalid GitHub pull-request head ref number: ${pull_request_number}" >&2
                exit 1
                ;;
            esac
            merge_ref="refs/zuper-pre-gate/pull/${pull_request_number}/merge"
            merge_ref_attempt=1
            merge_ref_attempts=15
            merge_ref_ready=false
            merge_ref_reason="merge ref has not been fetched"
            while [ "${merge_ref_attempt}" -le "${merge_ref_attempts}" ]; do
              git update-ref -d "${merge_ref}" >/dev/null 2>&1 || true
              if git fetch --no-tags --quiet origin "+refs/pull/${pull_request_number}/merge:${merge_ref}"; then
                # GitHub may update the pull head before it refreshes this synthetic ref's second parent.
                # Only its first parent identifies the target; Circle's exact pipeline SHA identifies the head.
                target_sha="$(git rev-parse "${merge_ref}^1")"
                if ! target_branch_heads="$(git ls-remote --heads origin)"; then
                  merge_ref_reason="cannot query current target-branch heads"
                elif ! printf '%s\n' "${target_branch_heads}" | awk -v sha="${target_sha}" '$1 == sha { found = 1 } END { exit !found }'; then
                  merge_ref_reason="merge ref identifies target ${target_sha}, which is not a current branch head"
                else
                  merge_ref_ready=true
                  break
                fi
              else
                merge_ref_reason="merge ref is unavailable"
              fi

              if [ "${merge_ref_attempt}" -lt "${merge_ref_attempts}" ]; then
                echo "Pull-request ${pull_request_number} ${merge_ref_reason}; retrying after GitHub ref propagation."
                sleep 2
              fi
              merge_ref_attempt=$((merge_ref_attempt + 1))
            done
            if [ "${merge_ref_ready}" != true ]; then
              echo "Cannot obtain a current GitHub merge ref for pull request ${pull_request_number}: ${merge_ref_reason}." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "${target_sha}" "${CIRCLE_SHA1}"; then
              echo "Pull-request head ${CIRCLE_SHA1} does not contain target commit ${target_sha}." >&2
              echo "Update the pull-request branch before running expensive CI jobs." >&2
              exit 1
            fi
            echo "Pull-request ${pull_request_number} head ${CIRCLE_SHA1} contains target commit ${target_sha}."
          done
  tag-upload:
    environment:
      CARGO_HOME: /root/.cargo
    docker:
    - image: docker.io/${DOCKER_TARGET_ORG}/${DOCKER_REPO_PREFIX}zuper-rs-ci:${Z_DISTRO}-${Z_UNIVERSE}
    resource_class: zuper-ci-ns/r1
    steps:
    - checkout
    - run:
        name: Initialize Git submodules
        command: |
          eval "$(ssh-agent -s)"
          printf '%s' "${ZUPER_UTILS_BUILD_DEPLOY_KEY_B64}" | base64 --decode | ssh-add -
          GIT_SSH_COMMAND='ssh -o StrictHostKeyChecking=accept-new' git submodule update --init --recursive
    - run:
        name: Prepare Cargo configuration
        command: |
          export CARGO_TARGET_DIR="$(pwd)/target"
          printf 'export CARGO_TARGET_DIR=%q\n' "${CARGO_TARGET_DIR}" >> "${BASH_ENV}"
          zuper-rs-ci-tools cargo-wrap zuper-rs-ci-tools prepare-cargo-config
          zuper-rs-ci-tools cargo-wrap zuper-rs-ci-tools prepare-deps
    - run:
        name: Create release tag
        command: saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/tag --heartbeat 30s --stats-interval 5s -- zuper-rs-ci-tools cargo-wrap zuper-figaro-cargo tag --extra-tag-suffix "/${Z_DISTRO}-${Z_UNIVERSE}" --allow-dirty
    - run:
        name: Upload release
        command: saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/upload --heartbeat 30s --stats-interval 5s -- zuper-rs-ci-tools cargo-wrap zuper-figaro-cargo upload --which last-tag --allow-dirty
    - run:
        name: Upload binary release assets
        command: |
          if ! command -v gh >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gh
            rm -rf /var/lib/apt/lists/*
          fi
          saferun run \
            --no-direnv \
            --standalone \
            --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/upload-binstall \
            --heartbeat 30s \
            --stats-interval 5s \
            -- zuper-rs-ci-tools cargo-wrap zuper-figaro-cargo upload-binstall \
            --which last-tag \
            --scope "${Z_DISTRO}-${Z_UNIVERSE}" \
            --allow-dirty
    - store_artifacts:
        path: out/saferun
        destination: saferun
  lint:
    environment:
      CARGO_HOME: /root/.cargo
