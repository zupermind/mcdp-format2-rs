    - run:
        name: Report tool versions
        command: |
          saferun --version
          cargo +nightly --version
          rustfmt +nightly --version
    - run:
        name: Check Rust formatting
        command: saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/rustfmt --heartbeat 30s --stats-interval 5s -- zuper-rs-ci-tools cargo-wrap cargo +nightly fmt --all -- --check
    - store_artifacts:
        path: out/saferun
        destination: saferun
  test-run:
    environment:
      CARGO_HOME: /root/.cargo
      CIRCLE_NODE_INDEX: << parameters.worker_index >>
      CIRCLE_NODE_TOTAL: 1
      RUST_BACKTRACE: full
      ZUPER_CIRCLE_LOGICAL_JOB: test-run
    docker:
    - image: docker.io/${DOCKER_TARGET_ORG}/${DOCKER_REPO_PREFIX}zuper-rs-ci-core:${Z_DISTRO}-${Z_UNIVERSE}-v1
      auth:
        username: $DOCKER_IO_READONLY_USERNAME
        password: $DOCKER_IO_READONLY_TOKEN
    steps:
    - checkout
    - run:
        name: Initialize Git submodules
        command: zuper-rs-ci-tools initialize-git-submodules
    - run:
        name: Prepare the environment
        command: |
          export CARGO_TARGET_DIR="$(pwd)/target"
          printf 'export CARGO_TARGET_DIR=%q\n' "${CARGO_TARGET_DIR}" >> "${BASH_ENV}"
          zuper-rs-ci-tools cargo-wrap zuper-rs-ci-tools all
          mkdir -p out/test-results out/test-status out/zuper-testing-cache
    - run:
        name: Report tool versions
        command: |
          saferun --version
          cargo --version
          cargo nextest --version
          cargo llvm-cov --version
          make --version
    - store_artifacts:
        path: build-stats
        destination: build-stats
    - run:
        name: pre-circle-tests
        command: saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/pre-circle-tests --heartbeat 30s --stats-interval 5s -- zuper-rs-ci-tools cargo-wrap zuper-rs-ci-tools run-if-make-target-exists pre-circle-tests
    - run:
        name: pre-circle-test-compile
        command: saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/pre-circle-test-compile --heartbeat 30s --stats-interval 5s -- zuper-rs-ci-tools cargo-wrap zuper-rs-ci-tools run-if-make-target-exists pre-circle-test-compile
    - run:
        name: Compile and archive coverage tests
        command: saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/test-compile --heartbeat 30s --stats-interval 5s -- env CARGO_LLVM_COV_TARGET_DIR=target/llvm-cov-target LLVM_PROFILE_FILE_NAME=node-${CIRCLE_NODE_INDEX}-%m-%p.profraw zuper-rs-ci-tools cargo-wrap cargo llvm-cov nextest-archive --archive-file out/nextest-coverage-tests.tar.zst --all-targets --no-default-features --profile ci --config-file .circleci/nextest.toml
    - run:
        name: Record per-shard coverage archive host
        command: |
          report_dir="out/nextest-coverage/node-${CIRCLE_NODE_INDEX}"
          mkdir -p "${report_dir}"
          rustc -vV | sed -n 's/^host: //p' > "${report_dir}/nextest-archive-host.txt"
          if [ ! -s "${report_dir}/nextest-archive-host.txt" ]; then
            echo 'Could not record the per-shard Nextest archive compiler host.' >&2
            exit 1
          fi
    - run:
        name: pre-circle-test-run
        command: saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/pre-circle-test-run --heartbeat 30s --stats-interval 5s -- zuper-rs-ci-tools cargo-wrap zuper-rs-ci-tools run-if-make-target-exists pre-circle-test-run
    - run:
        name: Run coverage tests
        command: |
          # The archive was compiled in the immediately preceding step on this
          # same worker, so execution cannot cross runner architectures.
