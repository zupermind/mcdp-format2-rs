version: 2.1
parameters:
  context_name:
    type: string
    default: z7-stage
  run_install:
    type: boolean
    default: false
workflows:
  install:
    when: << pipeline.parameters.run_install >>
    jobs:
    - install-linux:
        context: <<pipeline.parameters.context_name>>
        filters:
          branches:
            only:
            - z7-stage
            - z7-prod
            - z7-stage-lupa
          tags:
            ignore: /.*/
    - install-osx:
        context: <<pipeline.parameters.context_name>>
        filters:
          branches:
            only:
            - z7-stage
            - z7-prod
            - z7-stage-lupa
          tags:
            ignore: /.*/
  tag-upload:
    jobs:
    - tag-upload:
        context: <<pipeline.parameters.context_name>>
        filters:
          branches:
            only:
            - z7-stage
            - z7-prod
            - z7-stage-lupa
          tags:
            ignore: /.*/
  fresh:
    jobs:
    - lint-fresh:
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
  test:
    jobs:
    - pre-gate:
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
    - test-compile:
        requires:
        - pre-gate
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
        name: test-compile
    - test-run:
        requires:
        - test-compile
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
        name: test-run-1
        worker_index: 0
    - test-upload:
        requires:
        - test-compile
        - test-run-1: terminal
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
        name: test-upload
    - test-run-aggregate:
        requires:
        - test-run-1
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
        name: test-run-aggregate
    - test-report:
        requires:
        - test-run-aggregate
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
        name: test-report
    - rustfmt:
        requires:
        - pre-gate
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
    - lint:
        requires:
        - pre-gate
        context: <<pipeline.parameters.context_name>>
        filters:
          tags:
            ignore: /.*/
orbs:
  codecov: codecov/codecov@6
jobs:
  pre-gate:
    docker:
    - image: docker.io/${DOCKER_TARGET_ORG}/${DOCKER_REPO_PREFIX}zuper-rs-ci:${Z_DISTRO}-${Z_UNIVERSE}
      auth:
        username: $DOCKER_IO_READONLY_USERNAME
        password: $DOCKER_IO_READONLY_TOKEN
    resource_class: small.gen2
    steps:
    - checkout
    - run:
        name: Verify pull-request head contains its target branch
        command: zuper-rs-ci-tools verify-pr-target-contained
  tag-upload:
    environment:
      CARGO_HOME: /root/.cargo
    docker:
    - image: docker.io/${DOCKER_TARGET_ORG}/${DOCKER_REPO_PREFIX}zuper-rs-ci:${Z_DISTRO}-${Z_UNIVERSE}
    resource_class: small.gen2
    steps:
    - checkout
    - run:
        name: Initialize Git submodules
        command: zuper-rs-ci-tools initialize-git-submodules
    - run:
        name: Prepare Cargo configuration
        command: |
          export CARGO_TARGET_DIR="$(pwd)/target"
          printf 'export CARGO_TARGET_DIR=%q\n' "${CARGO_TARGET_DIR}" >> "${BASH_ENV}"
          zuper-rs-ci-tools cargo-wrap zuper-rs-ci-tools prepare-cargo-config
          zuper-rs-ci-tools cargo-wrap zuper-rs-ci-tools prepare-deps
    - run:
        name: Create release tag
        command: saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/tag --heartbeat 30s --stats-interval 5s -- zuper-rs-ci-tools cargo-wrap zuper-figaro-cargo tag --extra-tag-suffix "/${Z_DISTRO}-${Z_UNIVERSE}" --allow-dirty
    - run:
        name: Upload release
        command: saferun run --no-direnv --standalone --report-dir out/saferun/${CIRCLE_JOB}/node-${CIRCLE_NODE_INDEX}/upload --heartbeat 30s --stats-interval 5s -- zuper-rs-ci-tools cargo-wrap zuper-figaro-cargo upload --which last-tag --allow-dirty --no-verify
    - store_artifacts:
        path: out/saferun
        destination: saferun
  lint:
