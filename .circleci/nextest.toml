[profile.ci]
# Disable retries on CI
retries = 0
# Fail after the first test failure
fail-fast = false
# Show verbose output
status-level = "all"

# Repositories may place runtime test artifacts here from pre-circle-tests.
# Missing directories are ignored so ordinary repositories pay no cost.
archive.include = [
    { path = "nextest-extra", relative-to = "target", on-missing = "ignore" },
]

# Bound a stuck test: report it as slow every period and terminate it after
# this many periods. A descriptor slow-timeout pair replaces this default.
slow-timeout = { period = "60s", terminate-after = 30 }

[profile.ci.junit]
path = "junit.xml"
# These are the default values, specified for clarity.
store-success-output = false
store-failure-output = true

