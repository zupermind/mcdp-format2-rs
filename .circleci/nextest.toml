[profile.ci]
# Disable retries on CI
retries = 0
# Fail after the first test failure
fail-fast = false
# Show verbose output
status-level = "all"

slow-timeout = { period = "30s", terminate-after = 10 }


[profile.ci.junit]
path = "junit.xml"
# These are the default values, specified for clarity.
store-success-output = false
store-failure-output = true

