imports_granularity = "Item"

# Rustfmt configuration

# Increase line width to prevent breaking function calls
max_width = 120

# Don't break function calls if they fit on one line
fn_call_width = 120

# Do not force function bodies onto one line
fn_single_line = false

# Don't force function arguments to be on separate lines
force_multiline_blocks = false

# Allow longer chains before breaking
# chain_width = 100

# Don't break method chains if they fit
# single_line_if_else_max_width = 100

# Keep struct literals on one line if they fit
struct_lit_single_line = true

# Allow function parameters on one line
# fn_params_layout = "Compressed"

